name: Pack builder
description: Build a container image using `pack`

inputs:
  image:
    required: false
    type: string
    default: ghcr.io/${{ github.repository }}:${{ github.sha }}
  path:
    required: false
    type: string
    default: "."
  runtime_release:
    required: false
    type: string
  builder:
    required: false
    type: string
    default: ""
  use_builder:
    required: false
    type: string
    default: "upstream"
  buildpack:
    required: false
    type: string
    default: ""
  detect_buildpacks:
    required: false
    type: string
    default: "true"
  build_env:
    required: false
    type: string
    default: ""
  runtime_env:
    required: false
    type: string
    default: ""
  publish_image:
    required: false
    type: string
    default: "true"
  run_safety_checks:
    required: false
    type: string
    default: "true"
  comment_safety_checks:
    required: false
    type: string
    default: "true"
  github-token:
    required: false
    type: string
    default: ""

runs:
  using: "composite"
  steps:
    - name: Check config
      id: config
      shell: bash
      run: |
        echo "image_name=$(tr '[:upper:]' '[:lower:]' <<< "${{ inputs.image }}")" >> $GITHUB_OUTPUT

        if [ -n "${{ inputs.builder }}" ];
        then
          echo "Using custom builder: ${{ inputs.builder }}"
          echo "builder_image=${{ inputs.builder }}" >> $GITHUB_OUTPUT
        elif [ "${{ inputs.use_builder }}" == "upstream" ];
        then
          echo "Using upstream builder"
          echo "builder_image=heroku/builder:26" >> $GITHUB_OUTPUT
        elif [ "${{ inputs.use_builder }}" == "toolforge-latest" ];
        then
          echo "Using latest builder"
          config=$(curl -sf 'https://gitlab.wikimedia.org/repos/cloud/toolforge/toolforge-deploy/-/raw/main/components/builds-api/values/tools.yaml.gotmpl')
          echo "builder_image=$(yq .config.latestBuilder <<< "${config}")" >> $GITHUB_OUTPUT
        elif [ "${{ inputs.use_builder }}" == "toolforge-stable" ];
        then
          echo "Using stable builder"
          config=$(curl -sf 'https://gitlab.wikimedia.org/repos/cloud/toolforge/toolforge-deploy/-/raw/main/components/builds-api/values/tools.yaml.gotmpl')
          echo "builder_image=$(yq .config.builder <<< "${config}")" >> $GITHUB_OUTPUT
        elif [ "${{ inputs.use_builder }}" == "toolforge-deprecated" ];
        then
          config=$(curl -sf 'https://gitlab.wikimedia.org/repos/cloud/toolforge/toolforge-deploy/-/raw/main/components/builds-api/values/tools.yaml.gotmpl')

          valid_until=$(yq .config.deprecatedValidUntil <<< "${config}")
          if [ -z "${valid_until}" ] || [ "${valid_until}" == "null" ];
          then
            echo "Failed to find deprecation time in config"
            echo "${config}"
            exit 1
          fi

          if [ "$(date -d "${valid_until}" +%s)" -lt "$(date +%s)" ];
          then
            echo "Deprecated builder has expired (${valid_until})"
            exit 1
          fi

          echo "::warning::Deprecated builder will start failing at $valid_until"
          echo "builder_image=$(yq .config.deprecatedBuilder <<< "${config}")" >> $GITHUB_OUTPUT
        else
          echo "Unknown builder specified: ${{ inputs.use_builder }}"
          exit 1
        fi

    - name: Install pack
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        latest_version=$(gh api repos/buildpacks/pack/releases/latest --jq .tag_name)
        curl -fsSL "https://github.com/buildpacks/pack/releases/download/${latest_version}/pack-${latest_version}-linux.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack
        pack --version

    # pack fails to create ephemeral builders when the daemon uses the containerd image store
    # x-ref https://github.com/buildpacks/pack/issues/2527
    - name: Disable containerd snapshotter
      shell: bash
      run: |
        if docker info -f '{{ .DriverStatus }}' | grep -q 'io.containerd.snapshotter';
        then
          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          jq '.features["containerd-snapshotter"] = false' <<< "${config}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
        fi

    - name: Login to GHCR
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.github-token }}
      if: inputs.publish_image == 'true' && startsWith(steps.config.outputs.image_name, 'ghcr.io/')

    - name: Build image
      shell: bash
      run: |
        build_args=(
          "--builder" "${{ steps.config.outputs.builder_image }}"
          "--path" "${{ inputs.path }}"
          "--sbom-output-dir" "sbom/"
        )

        if [ -n "${{ inputs.build_env }}" ];
        then
          while IFS= read -r build_env;
          do
            if [ -n "$build_env" ];
            then
              build_args+=("-e" "$build_env")
            fi
          done <<< "${{ inputs.build_env }}"
        fi

        if [ "${{ inputs.detect_buildpacks }}" == "true" ];
        then
          # x-ref https://github.com/heroku/cnb-builder-images/blob/main/builder-24/builder.toml

          ## https://github.com/heroku/buildpacks-deb-packages
          if [ -f "${{ inputs.path }}/project.toml" ] && grep -q '\[com.heroku.buildpacks.deb-packages\]' "${{ inputs.path }}/project.toml";
          then
            build_args+=("--buildpack" "heroku/deb-packages")
          fi

          ## https://github.com/heroku/buildpacks-nodejs
          if [ -f "${{ inputs.path }}/package.json" ];
          then
            build_args+=("--buildpack" "heroku/nodejs")
          fi

          ## https://github.com/heroku/buildpacks-procfile
          if [ -f "${{ inputs.path }}/Procfile" ];
          then
            build_args+=("--buildpack" "heroku/procfile")
          fi

          ## https://github.com/heroku/buildpacks-python
          ## Note: this pack handles a lot more (Pipfile, uv, requirements.txt etc), this is 'our' standard
          if [ -f "${{ inputs.path }}/pyproject.toml" ];
          then
            build_args+=("--buildpack" "heroku/python")
          fi

          ## https://github.com/heroku/buildpacks-php
          if [ -f "${{ inputs.path }}/composer.json" ];
          then
            build_args+=("--buildpack" "heroku/php")
          fi
        fi

        # --post-buildpack only appends to the builder's order groups, it is ignored once
        # any --buildpack is specified, so append to the explicit list when we have one
        append_buildpack_flag="--post-buildpack"
        for arg in "${build_args[@]}";
        do
          if [ "${arg}" == "--buildpack" ];
          then
            append_buildpack_flag="--buildpack"
            break
          fi
        done

        ## Explicit additional buildpack
        if [ ! -z "${{ inputs.buildpack }}" ];
        then
          build_args+=(
            "${append_buildpack_flag}" "${{ inputs.buildpack }}"
          )
        fi

        # Future proof handling other vars
        # We only want to include the extra pack if the work is needed
        runtime_env_vars=()
        if [ -n "${{ inputs.runtime_release }}" ];
        then
          runtime_env_vars+=(-e "RUNTIME_ENVVAR_RELEASE_TAG=${{ inputs.runtime_release }}")
          build_args+=(-e "RELEASE_TAG=${{ inputs.runtime_release }}")
        fi

        if [ -n "${{ inputs.runtime_env }}" ];
        then
          while IFS= read -r runtime_env;
          do
            if [ -n "$runtime_env" ];
            then
              runtime_env_vars+=("-e" "RUNTIME_ENVVAR_$runtime_env")
            fi
          done <<< "${{ inputs.runtime_env }}"
        fi

        if [ ${#runtime_env_vars[@]} -gt 0 ];
        then
          build_args+=(
            "${append_buildpack_flag}" "https://github.com/InfraBits/envvar-buildpack/releases/download/v1.0.0/buildpack.tar.gz"
          )
          build_args+=("${runtime_env_vars[@]}")
        fi

        if [ "${{ inputs.publish_image }}" == "true" ];
        then
          build_args+=("--publish")
        fi

        # Avoid set -x as it exposes secrets contained in build_env
        echo "Running pack for ${{ steps.config.outputs.image_name }}"
        pack build "${{ steps.config.outputs.image_name }}" "${build_args[@]}"

    - name: Install syft & grype
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        for tool in syft grype;
        do
          latest_version=$(gh api "repos/anchore/${tool}/releases/latest" --jq .tag_name)
          curl -fsSL "https://github.com/anchore/${tool}/releases/download/${latest_version}/${tool}_${latest_version#v}_linux_amd64.tar.gz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv "${tool}"
          "${tool}" version
        done
      if: inputs.run_safety_checks == 'true'

    - name: Scan Image
      id: scan
      shell: bash
      run: |
        report_dir="${{ runner.temp }}/grype-$(uuidgen)"
        mkdir -p "${report_dir}"
        echo "report_dir=${report_dir}" >> $GITHUB_OUTPUT

        syft scan "${{ steps.config.outputs.image_name }}" -o syft-json="${report_dir}/sbom.syft.json"
        grype "sbom:${report_dir}/sbom.syft.json" -o table -o json="${report_dir}/grype.json"
      if: inputs.run_safety_checks == 'true'

    - name: Comment on PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('${{ steps.scan.outputs.report_dir }}/grype.json', 'utf8'));

          async function run() {
            const severityIcon = { Critical: '🔴', High: '🟠' };
            const severityOrder = ['Critical', 'High'];

            // Match ci-trivy: only report fixable critical/high vulnerabilities
            const seen = new Set();
            const vulns = [];
            for (const m of (data.matches || [])) {
              const v = m.vulnerability;
              const a = m.artifact;
              if (!severityOrder.includes(v.severity) || v.fix?.state !== 'fixed') {
                continue;
              }
              const key = `${v.id}/${a.name}/${a.version}`;
              if (!seen.has(key)) {
                seen.add(key);
                vulns.push({ v, a });
              }
            }
            vulns.sort((x, y) =>
              severityOrder.indexOf(x.v.severity) - severityOrder.indexOf(y.v.severity) ||
              x.a.name.localeCompare(y.a.name));

            const byType = {};
            for (const entry of vulns) {
              (byType[entry.a.type] ||= []).push(entry);
            }

            let sections = [];
            for (const [type, entries] of Object.entries(byType).sort()) {
              const rows = entries.map(({ v, a }) => {
                const icon = severityIcon[v.severity] || '';
                const id = v.dataSource ? `[${v.id}](${v.dataSource})` : v.id;
                let title = (v.description || '').replace(/\s+/g, ' ').replace(/\|/g, '\\|');
                if (title.length > 120) {
                  title = title.slice(0, 117) + '...';
                }
                return `| ${icon} ${v.severity} | ${a.name} | ${a.version} | ${v.fix.versions.join(', ') || '—'} | ${id} | ${title} |`;
              });
              sections.push(
                `### ${type} packages\n` +
                `| Severity | Package | Installed | Fixed | Vulnerability | Description |\n` +
                `|----------|---------|-----------|-------|---------------|-------------|\n` +
                rows.join('\n')
              );
            }

            const marker = '<!-- grype-scan -->';
            const maxBody = 65536;
            const header = '## Grype Security Scan\n\n';
            const truncationNotice = '\n\n> ⚠️ Output truncated — see the workflow logs for the full report.';

            let summary = '_No fixable vulnerabilities found._';
            if (vulns.length) {
              const counts = severityOrder
                .map(s => [s, vulns.filter(e => e.v.severity === s).length])
                .filter(([, n]) => n > 0)
                .map(([s, n]) => `${severityIcon[s]} ${n} ${s.toLowerCase()}`);
              const packages = new Set(vulns.map(e => `${e.a.name}@${e.a.version}`)).size;
              summary = `Found ${counts.join(', ')} fixable ${vulns.length === 1 ? 'vulnerability' : 'vulnerabilities'} ` +
                `across ${packages} ${packages === 1 ? 'package' : 'packages'} in \`${{ steps.config.outputs.image_name }}\`.\n\n` +
                sections.join('\n\n');
            }

            let body = marker + '\n' + header + summary;
            if (body.length > maxBody) {
              body = body.slice(0, maxBody - truncationNotice.length) + truncationNotice;
            }

            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            }).then(r => r.data.find(c => c.body.includes(marker)));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          }

          try {
            await run();
          } catch (err) {
            if (err.status === 403) {
              core.warning(`Skipping PR comment: ${err.message}`);
            } else {
              throw err;
            }
          }

      if: inputs.run_safety_checks == 'true' && inputs.comment_safety_checks == 'true' && inputs.github-token != '' && github.event_name == 'pull_request'

